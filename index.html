<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent-dark: #9bbf1a;
      --text: #f0f0f0;
      --muted: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.2rem;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    button.add-btn {
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button.add-btn:hover { background: var(--accent-dark); }
    button.add-btn:active { transform: scale(0.96); }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stats span { font-weight: 500; color: var(--text); }

    ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.2s ease;
      transition: opacity 0.2s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    li.done { opacity: 0.45; }
    li.done .todo-text { text-decoration: line-through; color: var(--muted); }

    .check-btn {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      font-size: 12px;
      color: #0f0f0f;
    }

    li.done .check-btn {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-text { flex: 1; font-size: 0.95rem; }

    .del-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .del-btn:hover { color: #ff6b6b; background: rgba(255,107,107,0.1); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>My <span>Tasks</span></h1>
  <p class="subtitle">Stay on top of things ✓</p>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a new task..." />
    <button class="add-btn" onclick="addTask()">+</button>
  </div>

  <div class="stats">
    Total: <span id="totalCount">0</span> &nbsp;|&nbsp;
    Done: <span id="doneCount">0</span> &nbsp;|&nbsp;
    Left: <span id="leftCount">0</span>
  </div>

  <ul id="taskList">
    <li class="empty" id="emptyMsg">No tasks yet. Add one above! 👆</li>
  </ul>
</div>

<script>
  let tasks = [];

  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, done: false });
    input.value = '';
    render();
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  function render() {
    const list = document.getElementById('taskList');
    const empty = document.getElementById('emptyMsg');

    document.getElementById('totalCount').textContent = tasks.length;
    document.getElementById('doneCount').textContent = tasks.filter(t => t.done).length;
    document.getElementById('leftCount').textContent = tasks.filter(t => !t.done).length;

    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty" id="emptyMsg">No tasks yet. Add one above! 👆</li>';
      return;
    }

    list.innerHTML = tasks.map(t => `
      <li class="${t.done ? 'done' : ''}">
        <button class="check-btn" onclick="toggleTask(${t.id})">${t.done ? '✓' : ''}</button>
        <span class="todo-text">${t.text}</span>
        <button class="del-btn" onclick="deleteTask(${t.id})">✕</button>
      </li>
    `).join('');
  }
</script>
</body>
</html>
